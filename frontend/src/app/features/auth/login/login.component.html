<div class="login-wrapper">
  <div class="login-box">
    <div class="logo">
      <div class="logo-icon">🍽️</div>
      <h1>Comanda <span>Digital</span></h1>
      <p>Sistema de pedidos inteligente</p>
    </div>
    <div *ngIf="erro" class="alert alert-error">{{ erro }}</div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="seu&#64;email.com" (keyup.enter)="login()">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" [(ngModel)]="senha" placeholder="••••••••" (keyup.enter)="login()">
    </div>
    <button class="btn-primary" style="width:100%;padding:14px" (click)="login()" [disabled]="loading">
      {{ loading ? 'Entrando...' : 'Entrar' }}
    </button>

    <div class="divider"><span>ou acesse como cliente</span></div>

    <div class="acesso-rapido">
      <a href="/cliente" class="btn-acesso">
        <span class="acesso-icon">🪑</span>
        <div>
          <div class="acesso-title">Pedido na Mesa</div>
          <div class="acesso-sub">Estou no restaurante</div>
        </div>
      </a>
      <a href="/delivery" class="btn-acesso btn-acesso-delivery">
        <span class="acesso-icon">🛵</span>
        <div>
          <div class="acesso-title">Delivery</div>
          <div class="acesso-sub">Quero receber em casa</div>
        </div>
      </a>
    </div>

    <div class="hints">
      <p>Equipe — credenciais de teste:</p>
      <span>admin&#64;comanda.com · garcom&#64;comanda.com · cozinha&#64;comanda.com</span>
      <span>Senha: <b>admin123</b></span>
    </div>
  </div>
</div>

<style>
.login-wrapper { min-height:100vh; display:flex; align-items:center; justify-content:center; background: radial-gradient(ellipse at 50% 0%, rgba(255,107,53,.12) 0%, transparent 60%), var(--bg); }
.login-box { width:100%; max-width:440px; padding:40px; background:var(--bg2); border:1px solid var(--border); border-radius:16px; }
.logo { text-align:center; margin-bottom:32px; }
.logo-icon { font-size:48px; margin-bottom:12px; }
.logo h1 { font-size:28px; font-weight:700; margin-bottom:8px; }
.logo h1 span { color:var(--accent); }
.logo p { color:var(--text2); font-size:14px; }
.divider { display:flex; align-items:center; gap:12px; margin:20px 0 16px; }
.divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
.divider span { font-size:12px; color:var(--text2); white-space:nowrap; }
.acesso-rapido { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
.btn-acesso { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--bg3); border:1px solid var(--border); border-radius:10px; color:var(--text); text-decoration:none; transition:all .2s; }
.btn-acesso:hover { border-color:var(--accent); transform:translateY(-2px); }
.btn-acesso-delivery:hover { border-color:#3b82f6; }
.acesso-icon { font-size:24px; }
.acesso-title { font-size:14px; font-weight:600; }
.acesso-sub { font-size:11px; color:var(--text2); margin-top:2px; }
.hints { margin-top:16px; text-align:center; font-size:12px; color:var(--text2); }
.hints p { margin-bottom:4px; }
.hints span { display:block; line-height:1.8; }
.hints b { color:var(--accent); }
</style>
