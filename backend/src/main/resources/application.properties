# ===== DATASOURCE — PostgreSQL (Render) =====
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA — cria tabelas automaticamente =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ===== SQL INICIAL — roda data.sql na primeira vez =====
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.jpa.defer-datasource-initialization=true

# ===== JWT =====
jwt.secret=${JWT_SECRET:comanda-digital-secret-key-2024-muito-segura}
jwt.expiration=86400000

# ===== CORS =====
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:4200}

# ===== SERVER =====
server.port=${PORT:8080}
